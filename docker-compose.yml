services:
  deploy-platform-web:
    build:
      context: .
    image: deploy-platform-preview:latest
    container_name: deploy-platform-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgresql://deploy:deploy-password@postgres:5432/deploy_platform
      DEPLOY_PLATFORM_DB: /data/deploy-platform.sqlite3
      DATA_DIR: /data
      HOST_DATA_DIR: ${HOST_DATA_DIR:-${PWD}/data}
      TZ: ${TZ:-Asia/Shanghai}
      REGISTRY_URL: ${REGISTRY_URL:-}
      IMAGE_NAMESPACE: ${IMAGE_NAMESPACE:-deploy-platform}
      REGISTRY_USERNAME: ${REGISTRY_USERNAME:-}
      REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:-}
      AGENT_SHARED_TOKEN: ${AGENT_SHARED_TOKEN:-dev-agent-token}
      MAX_CONCURRENT_EXECUTIONS: ${MAX_CONCURRENT_EXECUTIONS:-5}
      MAX_QUEUED_EXECUTIONS: ${MAX_QUEUED_EXECUTIONS:-100}
      MAX_BATCH_DEPLOY_TASKS: ${MAX_BATCH_DEPLOY_TASKS:-50}
      MAX_DOCKER_BUILDS: ${MAX_DOCKER_BUILDS:-2}
      MAX_IMAGE_PUSHES: ${MAX_IMAGE_PUSHES:-2}
      MAX_AGENT_DEPLOYS_PER_CLUSTER: ${MAX_AGENT_DEPLOYS_PER_CLUSTER:-5}
      SDK_BUILD_CPUS: ${SDK_BUILD_CPUS:-2}
      SDK_BUILD_MEMORY: ${SDK_BUILD_MEMORY:-4g}
      MAVEN_DOWNLOAD_THREADS: ${MAVEN_DOWNLOAD_THREADS:-8}
      GIT_SOURCE_CACHE: ${GIT_SOURCE_CACHE:-true}
      CLEAN_WORKSPACE_AFTER_BUILD: ${CLEAN_WORKSPACE_AFTER_BUILD:-true}
      CLEAN_LOCAL_IMAGE_AFTER_BUILD: ${CLEAN_LOCAL_IMAGE_AFTER_BUILD:-true}
      DOCKER_PRUNE_AFTER_BUILD: ${DOCKER_PRUNE_AFTER_BUILD:-false}
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: deploy-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: deploy_platform
      POSTGRES_USER: deploy
      POSTGRES_PASSWORD: deploy-password
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deploy -d deploy_platform"]
      interval: 5s
      timeout: 3s
      retries: 20
