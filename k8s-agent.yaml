apiVersion: v1
kind: Namespace
metadata:
  name: deploy-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-agent
  namespace: deploy-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deploy-agent
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "pods", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deploy-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deploy-agent
subjects:
  - kind: ServiceAccount
    name: deploy-agent
    namespace: deploy-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-agent
  namespace: deploy-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deploy-agent
  template:
    metadata:
      labels:
        app: deploy-agent
    spec:
      serviceAccountName: deploy-agent
      containers:
        - name: agent
          image: your-registry.example.com/deploy-platform:latest
          imagePullPolicy: Always
          env:
            - name: MODE
              value: agent
            - name: PLATFORM_URL
              value: http://YOUR_PLATFORM_HOST:8080
            - name: CLUSTER_NAME
              value: dev-01
            - name: AGENT_TOKEN
              value: dev-agent-token
